version: '3.8'

services:
  aiops-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aiops.db
      - PROMETHEUS_URL=http://prometheus:9090
      - NODE_ENV=production
    volumes:
      - aiops_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  aiops-frontend:
    image: node:20-alpine
    container_name: aiops-web-ui
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - BACKEND_URL=http://aiops-backend:8000
    depends_on:
      - aiops-backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aiops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

volumes:
  aiops_data:
